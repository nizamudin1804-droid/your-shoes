<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product | Your Shoes</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="main-header">

        <div class="header-container">

            <a href="index.html" class="logo">
                YOUR SHOES
            </a>


            <nav class="desktop-nav">

                <a href="index.html">
                    Home
                </a>

                <a href="shop.html" class="active">
                    Shop
                </a>

                <a href="about-us.html">
                    About
                </a>

                <a href="contact.html">
                    Contact
                </a>

            </nav>


            <a href="login.html" class="header-contact">
    Login / Sign Up
</a>
            <button class="menu-btn" id="menuBtn">

                <span></span>
                <span></span>
                <span></span>

            </button>

        </div>


        <nav class="mobile-nav" id="mobileNav">

            <a href="index.html">
                Home
            </a>

            <a href="shop.html">
                Shop
            </a>

            <a href="about-us.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

    </header>



    <!-- =========================
         PRODUCT DETAILS
    ========================== -->

    <section class="single-product-section">

        <div class="container">


            <!-- Breadcrumb -->

            <div class="product-breadcrumb">

                <a href="shop.html">
                    Shop
                </a>

                <span>/</span>

                <span id="breadcrumbProduct">
                    Product
                </span>

            </div>



            <!-- Product -->

            <div class="single-product-grid">


                <!-- PRODUCT IMAGE -->

                <div class="single-product-image">

                    <span
                        class="single-product-label"
                        id="productLabel"
                    ></span>

                    <img
                        id="productImage"
                        src=""
                        alt="Product"
                    >

                </div>



                <!-- PRODUCT DETAILS -->

                <div class="single-product-details">

                    <p
                        class="single-product-category"
                        id="productCategory"
                    >
                        Category
                    </p>


                    <h1 id="productName">
                        Product Name
                    </h1>


                    <div
                        class="single-product-price"
                        id="productPrice"
                    >
                        Rs. 0
                    </div>


                    <p
                        class="single-product-description"
                        id="productDescription"
                    >
                        Product description.
                    </p>



                    <!-- SIZE -->

                    <div class="product-option">

                        <label for="productSize">
                            Select Size
                        </label>

                        <select id="productSize">

                            <option value="">
                                Select Size
                            </option>

                            <option value="6">
                                6
                            </option>

                            <option value="7">
                                7
                            </option>

                            <option value="8">
                                8
                            </option>

                            <option value="9">
                                9
                            </option>

                            <option value="10">
                                10
                            </option>

                            <option value="11">
                                11
                            </option>

                            <option value="12">
                                12
                            </option>

                        </select>

                    </div>



                    <!-- QUANTITY -->

                    <div class="product-option">

                        <label>
                            Quantity
                        </label>


                        <div class="quantity-box">

                            <button
                                type="button"
                                id="minusBtn"
                            >
                                −
                            </button>


                            <input
                                type="number"
                                id="productQuantity"
                                value="1"
                                min="1"
                                max="20"
                            >


                            <button
                                type="button"
                                id="plusBtn"
                            >
                                +
                            </button>

                        </div>

                    </div>



                    <!-- TOTAL -->

                    <div class="product-total">

                        <span>
                            Total Price
                        </span>

                        <strong id="productTotal">
                            Rs. 0
                        </strong>

                    </div>



                    <!-- BUTTONS -->

                    <div class="product-actions">

                        <button
                            type="button"
                            class="buy-now-btn"
                            id="buyNowBtn"
                        >
                            Buy Now
                        </button>


                        <a
                            href="shop.html"
                            class="back-shop-btn"
                        >
                            Continue Shopping
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </section>



   


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="simple-footer">

        © 2026 Your Shoes. All Rights Reserved.

    </footer>



    <!-- JS -->

    <script src="assets/js/theme.js"></script>

    <script src="assets/js/product.js"></script>


</body>

</html>
