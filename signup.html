<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Your Shoes</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>

    <header class="main-header">

        <div class="header-container">

            <a href="index.html" class="logo">
                YOUR SHOES
            </a>

            <nav class="desktop-nav">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="about-us.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>

            <a href="login.html" class="header-contact">
                Login
            </a>

            <button class="menu-btn" id="menuBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

        <nav class="mobile-nav" id="mobileNav">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="about-us.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-heading">

                <span>YOUR SHOES</span>

                <h1>Create Account</h1>

                <p>
                    Create your account and start shopping.
                </p>

            </div>


            <form id="signupForm">

                <div class="auth-field">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="signupPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="signupPhone"
                        placeholder="03XX XXXXXXX"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="signupConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="signupConfirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit-btn"
                >
                    Create Account
                </button>


                <div
                    id="signupMessage"
                    class="auth-message"
                ></div>

            </form>


            <div class="auth-switch">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </main>


    <footer class="simple-footer">
        © 2026 Your Shoes. All Rights Reserved.
    </footer>


    <script src="assets/js/theme.js"></script>
    <script src="assets/js/auth.js"></script>

</body>

</html>
